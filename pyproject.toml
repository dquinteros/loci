[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loci"
version = "0.1.0"
description = "Local RAG memory system for Claude Code"
requires-python = ">=3.10"
dependencies = [
  "sqlite-vec>=0.1.7",
  "fastembed>=0.4.0",
  "mcp[cli]>=1.0.0",
  "click>=8.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "trafilatura>=2.0",
  "watchdog>=4.0",
  "pathspec>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0"]

[project.scripts]
loci = "loci.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
